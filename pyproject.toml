[project]
name = "shrimp-memory"
version = "0.1.0"
description = "Exploratory research project"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
llm-cpu = [
    "torch==2.14.1",
    "transformers==5.19.0",
    "tokenizers==0.23.3",
    "safetensors==0.8.0",
    "accelerate==1.15.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "llm-cpu" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
